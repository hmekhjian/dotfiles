#
# hyprpaper.conf - Simple single wallpaper configuration
#

# 1. preload: Load the image into memory
# Replace the path with your actual image file path (absolute or relative)
preload = ~/dotfiles/assets/wallpaper1jpg

# 2. wallpaper: Set the loaded image to one or more outputs
# The format is 'output_name, image_name'
# The '*' means "apply this wallpaper to ALL outputs/monitors".
wallpaper = eDP-1, ~/dotfiles/assets/wallpaper1jpg 

# Optional: Set the initial transition duration (in milliseconds)
# This controls how fast the wallpaper appears when Hyprland starts.
ipc = off
splash = false 
splash_offset = 2
# A duration of 0 means instant
# You can change this to 500 for a smooth fade-in
# fade_duration = 0
